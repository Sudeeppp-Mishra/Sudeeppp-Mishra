<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110" role="img" aria-label="Portfolio">
  <defs>
    <style>
      @keyframes globePulse {
        0%, 100% { filter: drop-shadow(0 0 1px #D9A566); }
        50% { filter: drop-shadow(0 0 4px #FFF4D6); }
      }
      .icon-label {
        font-family: 'Silkscreen', 'Press Start 2P', 'VT323', ui-monospace, monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #FFFFFF;
        stroke: #12171B;
        stroke-width: 3.5px;
        stroke-linejoin: round;
        paint-order: stroke fill;
        text-anchor: middle;
        letter-spacing: 0.5px;
      }
      .icon-sub {
        font-family: 'IBM Plex Mono', 'Courier New', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #E2683C;
        text-anchor: middle;
        letter-spacing: 0.2px;
      }
      .shadow { fill: #7A3E2F; }
      svg { cursor: pointer; }
      svg:hover .icon-body { transform: translateY(-4px); }
      .icon-body { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
      .globe-glow { animation: globePulse 3s infinite ease-in-out; }
    </style>
  </defs>

  <g class="icon-body">
    <!-- Drop Shadow of Icon (Rust Brown) -->
    <rect x="72" y="16" width="44" height="40" rx="3" class="shadow"/>
    
    <!-- Retro Pixel Globe / Web Monitor Base -->
    <rect x="68" y="12" width="44" height="38" rx="3" fill="#F1E7CF" stroke="#12171B" stroke-width="3"/>
    
    <!-- Screen / Globe Grid -->
    <rect x="73" y="17" width="34" height="28" fill="#E2683C"/>
    
    <!-- Pixel Globe Lines inside with Gentle Pulse -->
    <g class="globe-glow">
      <circle cx="90" cy="31" r="10" fill="#D9A566" stroke="#12171B" stroke-width="2"/>
      <ellipse cx="90" cy="31" rx="4" ry="10" fill="none" stroke="#12171B" stroke-width="1.8"/>
      <line x1="80" y1="31" x2="100" y2="31" stroke="#12171B" stroke-width="1.8"/>
    </g>
    <rect x="84" y="46" width="12" height="4" fill="#D9A566" stroke="#12171B" stroke-width="2"/>
  </g>

  <!-- Title with Outline Font -->
  <text x="90" y="74" class="icon-label">Portfolio</text>
  <!-- Matching Sub-label with exact site address -->
  <text x="90" y="93" class="icon-sub">mishra-sudeep.com.np</text>
</svg>
