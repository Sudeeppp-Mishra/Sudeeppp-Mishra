<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" role="img" aria-label="GitHub">
  <defs>
    <style>
      .icon-label {
        font-family: 'Silkscreen', 'Press Start 2P', 'VT323', ui-monospace, monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #FFFFFF;
        stroke: #12171B;
        stroke-width: 3.5px;
        stroke-linejoin: round;
        paint-order: stroke fill;
        text-anchor: middle;
        letter-spacing: 0.5px;
      }
      .icon-sub {
        font-family: 'IBM Plex Mono', 'Courier New', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #1B2127;
        text-anchor: middle;
      }
      .shadow { fill: #12171B; }
      svg { cursor: pointer; }
      svg:hover .icon-body { transform: translateY(-3px); }
      .icon-body { transition: transform 0.15s ease-out; }
    </style>
  </defs>

  <g class="icon-body">
    <!-- Drop Shadow of Icon -->
    <rect x="62" y="16" width="44" height="38" rx="3" class="shadow"/>
    
    <!-- Retro CRT Monitor Case (exactly like Terminal bash in SS) -->
    <rect x="58" y="12" width="44" height="36" rx="3" fill="#F1E7CF" stroke="#12171B" stroke-width="3"/>
    
    <!-- Dark Terminal Screen -->
    <rect x="63" y="17" width="34" height="24" rx="2" fill="#12171B"/>
    
    <!-- Green Terminal Prompt inside -->
    <rect x="66" y="21" width="8" height="3" fill="#39D353"/>
    <rect x="76" y="21" width="12" height="3" fill="#39D353"/>
    <rect x="66" y="27" width="14" height="3" fill="#39D353"/>
    <rect x="66" y="33" width="5" height="3" fill="#39D353"/>
    
    <!-- Stand Base -->
    <rect x="74" y="48" width="12" height="4" fill="#12171B"/>
    <rect x="70" y="52" width="20" height="3" rx="1" fill="#12171B"/>
  </g>

  <!-- Title with Outline Font from Screenshot -->
  <text x="80" y="74" class="icon-label">GitHub</text>
  <!-- Sub-label -->
  <text x="80" y="92" class="icon-sub">@Sudeeppp</text>
</svg>
