<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Sudeep Mishra, Computer Engineering student building at the intersection of hardware logic and software craft">
<defs>
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes sunGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(226, 104, 60, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(243, 201, 143, 0.7)); }
    }
    @keyframes ledPulse {
      0%, 100% { fill: #2ecc71; filter: drop-shadow(0 0 4px #2ecc71); }
      50% { fill: #1f8b4c; filter: drop-shadow(0 0 1px #1f8b4c); }
    }
    @keyframes scanScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(8px); }
    }
    .cursor-blink {
      animation: blink 0.9s infinite steps(1);
    }
    .star-1 { animation: starTwinkle 2.2s infinite ease-in-out; transform-origin: 693px 123px; }
    .star-2 { animation: starTwinkle 3.1s infinite ease-in-out 0.7s; transform-origin: 763px 153px; }
    .star-3 { animation: starTwinkle 2.6s infinite ease-in-out 1.2s; transform-origin: 1093px 131px; }
    .star-4 { animation: starTwinkle 3.5s infinite ease-in-out 0.3s; transform-origin: 1033px 115px; }
    .star-5 { animation: starTwinkle 2.8s infinite ease-in-out 1.5s; transform-origin: 563px 111px; }
    .sun-animated { animation: sunGlow 4s infinite ease-in-out; }
    .led-live { animation: ledPulse 2s infinite ease-in-out; }
    .scanlines { animation: scanScroll 1.5s infinite linear; }
  </style>

  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" fill-opacity=".12"/>
  </pattern>
  <clipPath id="win"><rect x="43" y="88" width="1114" height="329"/></clipPath>
  <clipPath id="sun"><circle cx="960" cy="290" r="112"/></clipPath>
</defs>

<!-- Outer Shadow & Bevel -->
<rect width="1200" height="460" fill="#242E35"/>
<rect x="52" y="52" width="1120" height="380" fill="#12171B"/>
<rect x="40" y="40" width="1120" height="380" fill="#F1E7CF" stroke="#1B2127" stroke-width="6"/>

<!-- Window Titlebar -->
<rect x="43" y="43" width="1114" height="45" fill="#F1E7CF"/>
<line x1="43" y1="88" x2="1157" y2="88" stroke="#1B2127" stroke-width="4"/>

<!-- Titlebar Buttons -->
<rect x="62" y="54" width="24" height="24" fill="#F1E7CF" stroke="#1B2127" stroke-width="4"/>
<line x1="68" y1="66" x2="80" y2="66" stroke="#1B2127" stroke-width="3"/>

<rect x="1114" y="54" width="24" height="24" fill="#F1E7CF" stroke="#1B2127" stroke-width="4"/>
<line x1="1120" y1="60" x2="1132" y2="72" stroke="#1B2127" stroke-width="3"/>
<line x1="1132" y1="60" x2="1120" y2="72" stroke="#1B2127" stroke-width="3"/>

<!-- Titlebar Stripes -->
<g stroke="#1B2127" stroke-width="3">
  <line x1="102" y1="55" x2="480" y2="55"/><line x1="102" y1="62" x2="480" y2="62"/><line x1="102" y1="69" x2="480" y2="69"/><line x1="102" y1="76" x2="480" y2="76"/>
  <line x1="720" y1="55" x2="1098" y2="55"/><line x1="720" y1="62" x2="1098" y2="62"/><line x1="720" y1="69" x2="1098" y2="69"/><line x1="720" y1="76" x2="1098" y2="76"/>
</g>

<!-- Title & Live Status LED -->
<g transform="translate(600, 72)">
  <circle class="led-live" cx="-90" cy="-6" r="5" />
  <text text-anchor="middle" font-family="'IBM Plex Mono','Courier New',ui-monospace,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#1B2127" letter-spacing="2">SUDEEP.OS</text>
  <text x="82" y="-1" font-family="'IBM Plex Mono','Courier New',ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#7A3E2F" letter-spacing="1">[LIVE]</text>
</g>

<!-- Window Content Body -->
<g clip-path="url(#win)">
  <!-- Sunset Gradient Bands -->
  <rect x="43" y="88" width="1114" height="102" fill="#F6D9A0"/>
  <rect x="43" y="190" width="1114" height="60" fill="#F3C98F"/>
  <rect x="43" y="250" width="1114" height="167" fill="#EFB57C"/>

  <!-- Twinkling Pixel Stars -->
  <g fill="#FFF4D6">
    <rect class="star-1" x="690" y="120" width="6" height="6"/>
    <rect class="star-2" x="760" y="150" width="6" height="6"/>
    <rect class="star-3" x="1090" y="128" width="6" height="6"/>
    <rect class="star-4" x="1030" y="112" width="6" height="6"/>
    <rect class="star-5" x="560" y="108" width="6" height="6"/>
    <rect class="star-2" x="630" y="160" width="4" height="4"/>
    <rect class="star-4" x="880" y="130" width="5" height="5"/>
  </g>

  <!-- Animated Sun with Retro Scanline Cutouts -->
  <g class="sun-animated">
    <circle cx="960" cy="290" r="112" fill="#E2683C"/>
    <g clip-path="url(#sun)" fill="#EFB57C">
      <rect x="840" y="262" width="240" height="5"/>
      <rect x="840" y="280" width="240" height="8"/>
      <rect x="840" y="300" width="240" height="11"/>
      <rect x="840" y="322" width="240" height="14"/>
      <rect x="840" y="348" width="240" height="18"/>
    </g>
  </g>

  <!-- Rolling Dunes / Terrain -->
  <path d="M43 336 C200 300 330 312 470 336 C600 358 700 318 840 326 C980 334 1070 302 1157 322 L1157 417 L43 417 Z" fill="#D9A566"/>
  <path d="M43 368 C180 342 300 360 440 372 C580 384 700 350 860 360 C990 368 1080 344 1157 356 L1157 417 L43 417 Z" fill="#C2703D"/>
  <path d="M43 396 C220 378 340 394 520 398 C700 402 820 378 980 388 C1060 393 1110 384 1157 388 L1157 417 L43 417 Z" fill="#7A3E2F"/>

  <!-- Terminal Command Prompt with Blinking Cursor -->
  <text x="92" y="140" font-family="'IBM Plex Mono','Courier New',ui-monospace,Menlo,Consolas,monospace" font-size="24" font-weight="600" fill="#7A3E2F">$ whoami</text>
  <rect class="cursor-blink" x="214" y="121" width="14" height="24" fill="#7A3E2F"/>

  <!-- Typography -->
  <text x="92" y="214" font-family="'IBM Plex Mono','Courier New',ui-monospace,Menlo,Consolas,monospace" font-size="64" font-weight="700" fill="#1B2127" letter-spacing="-1">SUDEEP MISHRA</text>
  <text x="92" y="262" font-family="'IBM Plex Mono','Courier New',ui-monospace,Menlo,Consolas,monospace" font-size="23" font-weight="500" fill="#1B2127">Computer Engineering student building at the</text>
  <text x="92" y="294" font-family="'IBM Plex Mono','Courier New',ui-monospace,Menlo,Consolas,monospace" font-size="23" font-weight="500" fill="#1B2127">intersection of hardware logic and software craft.</text>
</g>

<!-- CRT Scanlines Overlay -->
<rect class="scanlines" width="1200" height="460" fill="url(#scan)" pointer-events="none"/>
</svg>
