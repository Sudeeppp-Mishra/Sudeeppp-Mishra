<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Sudeep Mishra, Computer Engineering student building at the intersection of hardware logic and software craft">
<defs>
  <style>
  /* <![CDATA[ */
    /* Cursor Blink */
    @keyframes cursorPulse {
      0%, 48% { opacity: 1; }
      50%, 98% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Star Twinkles (Multiple Harmonic Phases) */
    @keyframes starPulseA {
      0%, 100% { opacity: 0.15; transform: scale(0.75); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    @keyframes starPulseB {
      0%, 100% { opacity: 0.85; transform: scale(1.2); }
      50% { opacity: 0.1; transform: scale(0.7); }
    }
    @keyframes starPulseC {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.5); filter: drop-shadow(0 0 3px #FFF4D6); }
    }

    /* Sun Atmosphere Radiance and Heat Haze */
    @keyframes sunAura {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 8px rgba(226, 104, 60, 0.45));
      }
      50% {
        transform: scale(1.025);
        filter: drop-shadow(0 0 24px rgba(243, 201, 143, 0.85)) drop-shadow(0 0 45px rgba(226, 104, 60, 0.35));
      }
    }

    /* Sun Slices Heat Shimmer */
    @keyframes heatShimmer {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    /* Shooting Star */
    @keyframes meteorA {
      0% { transform: translate(450px, 92px); opacity: 0; }
      2% { opacity: 1; }
      10% { transform: translate(1080px, 148px); opacity: 0; }
      100% { transform: translate(1080px, 148px); opacity: 0; }
    }

    /* Distant Satellite Blip */
    @keyframes satelliteBlip {
      0% { transform: translate(520px, 105px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translate(840px, 105px); opacity: 0; }
    }

    /* Top Chassis Vent Activity Sweep */
    @keyframes ventSweep {
      0% { transform: translateX(-400px); opacity: 0; }
      15% { opacity: 0.7; }
      50% { transform: translateX(1200px); opacity: 0; }
      100% { transform: translateX(1200px); opacity: 0; }
    }

    /* Subtle Ridge Rim-light Shimmer */
    @keyframes rimShimmer {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; filter: drop-shadow(0 -1px 3px rgba(243, 201, 143, 0.8)); }
    }

    /* CRT Scanline Drift */
    @keyframes scanScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(8px); }
    }

    /* Typography Subtle Depth Breathing */
    @keyframes titleShadowBreath {
      0%, 100% { filter: drop-shadow(2px 2px 0px #7A3E2F); }
      50% { filter: drop-shadow(3px 3px 2px rgba(122, 62, 47, 0.85)); }
    }

    .cursor-blink { animation: cursorPulse 0.85s infinite steps(1); }
    .sun-glow { animation: sunAura 4.5s infinite ease-in-out; transform-origin: 960px 310px; }
    .sun-cuts { animation: heatShimmer 3s infinite ease-in-out; }
    .meteor-trail { animation: meteorA 9s infinite ease-in; }
    .sat-blip { animation: satelliteBlip 14s infinite linear 2s; }
    .vent-beam { animation: ventSweep 6s infinite ease-in-out; }
    .rim-glow { animation: rimShimmer 3.5s infinite ease-in-out; }
    .scanlines { animation: scanScroll 1.4s infinite linear; }
    .title-breath { animation: titleShadowBreath 4s infinite ease-in-out; }

    .star-a1 { animation: starPulseA 2.2s infinite ease-in-out; transform-origin: 693px 123px; }
    .star-a2 { animation: starPulseB 3.4s infinite ease-in-out 0.8s; transform-origin: 763px 153px; }
    .star-a3 { animation: starPulseC 2.8s infinite ease-in-out 1.2s; transform-origin: 1093px 131px; }
    .star-a4 { animation: starPulseA 3.8s infinite ease-in-out 0.4s; transform-origin: 1033px 115px; }
    .star-a5 { animation: starPulseC 2.5s infinite ease-in-out 1.6s; transform-origin: 563px 111px; }
    .star-a6 { animation: starPulseB 3.1s infinite ease-in-out 1.9s; transform-origin: 633px 163px; }
    .star-a7 { animation: starPulseA 2.9s infinite ease-in-out 1.0s; transform-origin: 883px 133px; }
    .star-a8 { animation: starPulseC 3.5s infinite ease-in-out 2.2s; transform-origin: 513px 131px; }
    .star-a9 { animation: starPulseB 2.7s infinite ease-in-out 0.6s; transform-origin: 823px 118px; }

    .mono { font-family: 'IBM Plex Mono', 'Courier New', ui-monospace, Menlo, Consolas, monospace; }
  /* ]]> */
  </style>

  <!-- Subtler 4% Opacity Scanlines -->
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" fill-opacity=".04"/>
  </pattern>
  <clipPath id="win"><rect x="43" y="88" width="1114" height="329"/></clipPath>
  <clipPath id="sun"><circle cx="960" cy="310" r="112"/></clipPath>
  <clipPath id="vents-clip"><rect x="58" y="53" width="1084" height="28"/></clipPath>

  <!-- Vent Glow Gradient -->
  <linearGradient id="vent-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#E2683C" stop-opacity="0"/>
    <stop offset="50%" stop-color="#FFF4D6" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#E2683C" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Outer Rust Brown Shadow (Transparent outer page background) -->
<rect x="52" y="52" width="1120" height="380" fill="#7A3E2F" rx="3"/>
<!-- Window Frame -->
<rect x="40" y="40" width="1120" height="380" fill="#F1E7CF" stroke="#1B2127" stroke-width="6" rx="2"/>

<!-- Corner Hardware Screws (Authentic Vintage Microcomputer Chassis) -->
<g fill="#F1E7CF" stroke="#1B2127" stroke-width="2">
  <circle cx="54" cy="54" r="5"/>
  <line x1="51" y1="54" x2="57" y2="54"/>
  <circle cx="1146" cy="54" r="5"/>
  <line x1="1143" y1="54" x2="1149" y2="54"/>
</g>

<!-- Clean Retro Hardware Top Bar (Continuous Ventilation Grill) -->
<rect x="43" y="43" width="1114" height="45" fill="#F1E7CF"/>
<line x1="43" y1="88" x2="1157" y2="88" stroke="#1B2127" stroke-width="4"/>

<!-- Vent Grill Base Lines -->
<g stroke="#1B2127" stroke-width="3">
  <line x1="68" y1="56" x2="1132" y2="56"/>
  <line x1="68" y1="63" x2="1132" y2="63"/>
  <line x1="68" y1="70" x2="1132" y2="70"/>
  <line x1="68" y1="77" x2="1132" y2="77"/>
</g>

<!-- Animated Activity Light Pulse Sweeping Across Top Vent Grill -->
<g clip-path="url(#vents-clip)">
  <rect class="vent-beam" y="53" width="180" height="28" fill="url(#vent-glow-grad)"/>
</g>

<!-- Window Content Body -->
<g clip-path="url(#win)">
  <!-- Sunset Gradient Bands -->
  <rect x="43" y="88" width="1114" height="102" fill="#F6D9A0"/>
  <rect x="43" y="190" width="1114" height="60" fill="#F3C98F"/>
  <rect x="43" y="250" width="1114" height="167" fill="#EFB57C"/>

  <!-- Twinkling Pixel Stars with Multiple Speeds -->
  <g fill="#FFF4D6">
    <rect class="star-a1" x="690" y="120" width="6" height="6"/>
    <rect class="star-a2" x="760" y="150" width="6" height="6"/>
    <rect class="star-a3" x="1090" y="128" width="6" height="6"/>
    <rect class="star-a4" x="1030" y="112" width="6" height="6"/>
    <rect class="star-a5" x="560" y="108" width="6" height="6"/>
    <rect class="star-a6" x="630" y="160" width="5" height="5"/>
    <rect class="star-a7" x="880" y="130" width="5" height="5"/>
    <rect class="star-a8" x="510" y="130" width="4" height="4"/>
    <rect class="star-a9" x="820" y="116" width="5" height="5"/>
    <rect class="star-a3" x="970" y="140" width="4" height="4"/>
  </g>

  <!-- Distant Blinking Satellite Track -->
  <g class="sat-blip">
    <rect x="0" y="0" width="3" height="3" fill="#FFF4D6"/>
    <circle cx="1.5" cy="1.5" r="3" fill="#E2683C" opacity="0.6"/>
  </g>

  <!-- Shooting Star Pixel Trail -->
  <g class="meteor-trail">
    <line x1="0" y1="0" x2="-28" y2="-3" stroke="#FFF4D6" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <rect x="0" y="-1" width="4" height="4" fill="#FFFFFF"/>
  </g>

  <!-- Animated Sun with Ambient Heat Haze and Synthwave Cutouts -->
  <g class="sun-glow">
    <circle cx="960" cy="310" r="112" fill="#E2683C"/>
    <g class="sun-cuts" clip-path="url(#sun)" fill="#EFB57C">
      <rect x="840" y="270" width="240" height="5"/>
      <rect x="840" y="286" width="240" height="7"/>
      <rect x="840" y="304" width="240" height="10"/>
      <rect x="840" y="324" width="240" height="13"/>
      <rect x="840" y="347" width="240" height="16"/>
    </g>
  </g>

  <!-- Rolling Dunes / Terrain Overlapping the Setting Sun -->
  <!-- Dune 1 (Back Ridge) -->
  <path d="M43 325 C200 295 330 305 470 325 C600 345 720 308 840 315 C960 322 1060 295 1157 312 L1157 417 L43 417 Z" fill="#D9A566"/>
  
  <!-- Glowing Ridge Highlight (Atmospheric Sunset Rim-light) -->
  <path class="rim-glow" d="M43 325 C200 295 330 305 470 325 C600 345 720 308 840 315 C960 322 1060 295 1157 312" fill="none" stroke="#FFF4D6" stroke-width="2"/>

  <!-- Dune 2 (Mid Ridge) -->
  <path d="M43 358 C180 334 300 350 440 362 C580 374 700 340 860 350 C1000 358 1090 336 1157 348 L1157 417 L43 417 Z" fill="#C2703D"/>

  <!-- Dune 3 (Foreground Ridge) -->
  <path d="M43 390 C220 372 340 388 520 392 C700 396 820 372 980 382 C1060 387 1110 378 1157 382 L1157 417 L43 417 Z" fill="#7A3E2F"/>

  <!-- Subtle Scanline texture on backdrop only -->
  <rect class="scanlines" x="43" y="88" width="1114" height="329" fill="url(#scan)" pointer-events="none"/>

  <!-- $ whoami Prompt with Animated Blinking Cursor -->
  <text x="92" y="140" class="mono" font-size="24" font-weight="600" fill="#7A3E2F">$ whoami</text>
  <rect class="cursor-blink" x="214" y="121" width="14" height="24" fill="#7A3E2F"/>

  <!-- SUDEEP MISHRA Title with Breathing Warm Depth -->
  <text x="92" y="214" class="mono title-breath" font-size="64" font-weight="700" fill="#1B2127" letter-spacing="-1">SUDEEP MISHRA</text>

  <!-- Subtitle -->
  <text x="92" y="262" class="mono" font-size="24" fill="#1B2127">Computer Engineering student building at the</text>
  <text x="92" y="294" class="mono" font-size="24" fill="#1B2127">intersection of hardware logic and software craft.</text>
</g>
</svg>
