<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" preserveAspectRatio="none" role="presentation" aria-hidden="true">
  <defs>
    <style>
      @keyframes shimmer {
        0%, 100% { opacity: 0.88; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px rgba(226, 104, 60, 0.5)); }
      }
      @keyframes sweep {
        0% { transform: translateX(-300px); opacity: 0; }
        10% { opacity: 0.8; }
        50% { transform: translateX(1200px); opacity: 0; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      .div-glow {
        animation: shimmer 3s infinite ease-in-out;
      }
      .light-pulse {
        animation: sweep 5s infinite ease-in-out;
      }
    </style>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF4D6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFF4D6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF4D6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="div-clip">
      <rect width="1200" height="24" rx="2"/>
    </clipPath>
  </defs>

  <g class="div-glow" clip-path="url(#div-clip)">
    <!-- Base Stripes -->
    <rect width="1200" height="6" fill="#E2683C"/>
    <rect y="6" width="1200" height="6" fill="#D9A566"/>
    <rect y="12" width="1200" height="6" fill="#C2703D"/>
    <rect y="18" width="1200" height="6" fill="#7A3E2F"/>

    <!-- Moving Laser Light Sweep -->
    <rect class="light-pulse" y="0" width="220" height="24" fill="url(#beam)"/>
  </g>
</svg>
