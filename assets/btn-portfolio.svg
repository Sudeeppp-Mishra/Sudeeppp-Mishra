<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" role="img" aria-label="Portfolio">
  <defs>
    <style>
      .btn-bg { fill: #F1E7CF; transition: all 0.2s ease; }
      .btn-edge { fill: #D9A566; }
      .btn-shadow { fill: #12171B; }
      .btn-stroke { stroke: #1B2127; stroke-width: 3; }
      .btn-text { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 15px; font-weight: 700; fill: #1B2127; letter-spacing: 1.5px; }
      svg:hover .btn-bg { fill: #FFF4D6; }
    </style>
  </defs>
  <!-- 3D Shadow -->
  <rect x="6" y="8" width="208" height="36" rx="4" class="btn-shadow"/>
  <!-- Bevel Base -->
  <rect x="3" y="3" width="208" height="38" rx="4" class="btn-edge"/>
  <!-- Main Face -->
  <rect x="3" y="3" width="208" height="35" rx="4" class="btn-bg btn-stroke"/>
  <!-- Pixel Globe Icon -->
  <g transform="translate(24, 13)" fill="#E2683C" stroke="#1B2127" stroke-width="1.5">
    <circle cx="8" cy="8" r="7" fill="#F6D9A0"/>
    <ellipse cx="8" cy="8" rx="3.5" ry="7" fill="none"/>
    <line x1="1" y1="8" x2="15" y2="8"/>
  </g>
  <!-- Text -->
  <text x="50" y="26" class="btn-text">PORTFOLIO ↗</text>
</svg>
