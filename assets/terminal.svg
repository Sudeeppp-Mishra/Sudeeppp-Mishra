<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Terminal output showing Sudeep Mishra's details">
<defs>
  <style>
    @keyframes termBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes crtScan {
      0% { transform: translateY(0); }
      100% { transform: translateY(6px); }
    }
    .term-cursor {
      animation: termBlink 0.85s infinite steps(1);
    }
    .crt-lines {
      animation: crtScan 1.2s infinite linear;
    }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', ui-monospace, Menlo, Consolas, monospace; }
    .t-cmd  { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 700; fill: #D9A566; }
    .t-key  { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; fill: #EFB57C; }
    .t-val  { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 500; fill: #F1E7CF; }
    .t-dim  { font-family: 'IBM Plex Mono', monospace; font-size: 18px; fill: #8B949E; }
  </style>

  <pattern id="term-scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" fill-opacity=".06"/>
  </pattern>
  <clipPath id="term-body"><rect x="43" y="78" width="1114" height="222" rx="2"/></clipPath>
</defs>

<!-- Outer Window Rust Brown Shadow -->
<rect x="52" y="42" width="1120" height="268" fill="#7A3E2F" rx="2"/>
<!-- Window Frame -->
<rect x="40" y="30" width="1120" height="270" fill="#F1E7CF" stroke="#1B2127" stroke-width="6"/>

<!-- Window Titlebar with about.txt and Clean Stripes -->
<rect x="43" y="33" width="1114" height="45" fill="#F1E7CF"/>
<line x1="43" y1="78" x2="1157" y2="78" stroke="#1B2127" stroke-width="4"/>

<g stroke="#1B2127" stroke-width="2.5">
  <line x1="60" y1="46" x2="480" y2="46"/><line x1="60" y1="52" x2="480" y2="52"/><line x1="60" y1="58" x2="480" y2="58"/><line x1="60" y1="64" x2="480" y2="64"/>
  <line x1="720" y1="46" x2="1140" y2="46"/><line x1="720" y1="52" x2="1140" y2="52"/><line x1="720" y1="58" x2="1140" y2="58"/><line x1="720" y1="64" x2="1140" y2="64"/>
</g>

<!-- Center Title: about.txt -->
<text x="600" y="63" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#1B2127" letter-spacing="2">about.txt</text>

<!-- Terminal CRT Body -->
<g clip-path="url(#term-body)">
  <!-- Deep Retro CRT Background -->
  <rect x="43" y="78" width="1114" height="222" fill="#11161B"/>

  <!-- Command: cat about.txt -->
  <g transform="translate(80, 124)">
    <text class="t-cmd">sudeep@mishra ~ % <tspan fill="#F1E7CF">cat about.txt</tspan></text>
  </g>

  <!-- Output Lines -->
  <g transform="translate(100, 164)">
    <text class="t-key">studying</text>
    <text x="140" class="t-dim">:</text>
    <text x="170" class="t-val">Computer Engineering</text>
  </g>
  <g transform="translate(100, 198)">
    <text class="t-key">based in</text>
    <text x="140" class="t-dim">:</text>
    <text x="170" class="t-val">Nepal</text>
  </g>
  <g transform="translate(100, 232)">
    <text class="t-key">email</text>
    <text x="140" class="t-dim">:</text>
    <text x="170" class="t-val">contact.sudeepm@gmail.com</text>
  </g>

  <!-- Next Prompt Line with Blinking Phosphor Cursor -->
  <g transform="translate(80, 276)">
    <text class="t-cmd">sudeep@mishra ~ % </text>
    <rect class="term-cursor" x="210" y="-18" width="12" height="22" fill="#E2683C"/>
  </g>

  <!-- CRT Scanlines Texture -->
  <rect class="crt-lines" x="43" y="78" width="1114" height="222" fill="url(#term-scan)" pointer-events="none"/>
</g>
</svg>
